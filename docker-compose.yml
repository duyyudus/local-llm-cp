services:
  api-server:
    env_file:
      - ${APP_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/llm-cp-server/data/llm-cp.db
      GPU_SSH_KEY_PATH: /run/secrets/gpu_ssh_key
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    image: ${REGISTRY_REF:+${REGISTRY_REF}/}local-llm-cp-api-server:${IMAGE_TAG:-latest}
    volumes:
      - llm-cp-data:/app/llm-cp-server/data
      - ${GPU_SSH_KEY_FILE:-/dev/null}:/run/secrets/gpu_ssh_key:ro
    ports:
      - "${API_HOST_PORT:-8040}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_PORT: ${API_HOST_PORT:-8040}
    image: ${REGISTRY_REF:+${REGISTRY_REF}/}local-llm-cp-dashboard:${IMAGE_TAG:-latest}
    ports:
      - "${DASHBOARD_HOST_PORT:-3050}:80"
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  llm-cp-data:
